  <title>Sand sphinx boss</title>
  <desc>Stern sand sphinx boss with simple solid block eyes and a closed frown. Striped nemes headdress, lion paws and a tufted tail. Paws and body share one horizontal baseline. Five editable flat-color paths on an integer pixel grid. No shading, highlights or shadows. Transparent background.</desc>
