<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="234" height="169" viewBox="0 0 234 169" shape-rendering="crispEdges" version="1.1">
  <title>Axolotl simplified test - editable vector</title>
  <desc>Based on the axolotl in pet_goal.png: six rose gills, broad pink head, short legs and an upturned tail. Six-unit pixel steps, flat colors and a six-unit outline follow the simplified dog style. Original canvas and eye centers are retained. Independent eyes and mouth have solid pink underneath.</desc>
  <g id="axolotl-base" inkscape:groupmode="layer" inkscape:label="Body and gills">
    <g id="axolotl-tail">
      <path id="axolotl-tail-outline" fill="#16130e" d="M 6,90 H 18 V 102 H 30 V 108 H 42 V 114 H 66 V 150 H 30 V 144 H 18 V 138 H 6 V 126 H 0 V 102 H 6 Z" />
      <path id="axolotl-tail-fill" fill="#facac0" d="M 6,102 H 12 V 108 H 24 V 114 H 36 V 120 H 60 V 144 H 30 V 138 H 18 V 132 H 12 V 120 H 6 Z" />
      <path id="axolotl-tail-fin" fill="#f096a3" d="M 6,102 H 12 V 108 H 24 V 114 H 36 V 120 H 60 V 126 H 30 V 120 H 18 V 114 H 6 Z" />
    </g>
    <path id="axolotl-body-outline" fill="#16130e" d="M 72,102 H 174 V 144 H 180 V 168 H 144 V 162 H 138 V 156 H 126 V 168 H 90 V 162 H 84 V 168 H 48 V 156 H 42 V 126 H 54 V 114 H 72 Z" />
    <path id="axolotl-body-fill" fill="#facac0" d="M 78,108 H 168 V 150 H 174 V 162 H 150 V 150 H 144 V 138 H 138 V 150 H 120 V 144 H 114 V 150 H 120 V 162 H 96 V 150 H 90 V 138 H 84 V 150 H 78 V 162 H 54 V 150 H 48 V 126 H 60 V 120 H 78 Z" />
    <g id="axolotl-gills">
      <path id="axolotl-gill-outlines" fill="#16130e" d="M 54,6 H 72 V 18 H 84 V 30 H 96 V 42 H 102 V 60 H 84 V 54 H 72 V 42 H 60 V 30 H 54 Z M 192,6 H 210 V 36 H 204 V 48 H 198 V 60 H 180 V 36 H 186 V 18 H 192 Z M 24,36 H 42 V 42 H 54 V 48 H 66 V 54 H 84 V 78 H 60 V 72 H 48 V 66 H 36 V 54 H 24 Z M 216,36 H 234 V 60 H 228 V 66 H 216 V 78 H 192 V 60 H 204 V 48 H 216 Z M 48,78 H 84 V 102 H 72 V 108 H 36 V 90 H 42 V 84 H 48 Z M 192,78 H 210 V 84 H 228 V 102 H 216 V 108 H 192 Z" />
      <path id="axolotl-gill-fills" fill="#e16b83" d="M 60,12 H 66 V 24 H 78 V 36 H 90 V 48 H 96 V 54 H 84 V 48 H 78 V 36 H 66 V 24 H 60 Z M 198,12 H 204 V 30 H 198 V 42 H 192 V 54 H 186 V 36 H 192 V 24 H 198 Z M 30,42 H 36 V 48 H 48 V 54 H 60 V 60 H 78 V 72 H 60 V 66 H 48 V 60 H 42 V 54 H 30 Z M 222,42 H 228 V 54 H 222 V 60 H 210 V 72 H 198 V 66 H 204 V 60 H 210 V 54 H 216 V 48 H 222 Z M 48,90 H 54 V 84 H 78 V 96 H 66 V 102 H 42 V 96 H 48 Z M 198,84 H 204 V 90 H 222 V 96 H 210 V 102 H 198 Z" />
    </g>
    <path id="axolotl-head-outline" fill="#16130e" d="M 108,30 H 174 V 36 H 186 V 48 H 192 V 60 H 198 V 96 H 192 V 108 H 174 V 114 H 108 V 108 H 90 V 102 H 78 V 90 H 72 V 60 H 78 V 48 H 90 V 36 H 108 Z" />
    <path id="axolotl-head-fill" fill="#facac0" d="M 108,36 H 174 V 42 H 180 V 54 H 186 V 60 H 192 V 96 H 186 V 102 H 174 V 108 H 108 V 102 H 90 V 96 H 84 V 84 H 78 V 60 H 84 V 54 H 96 V 42 H 108 Z" />
    <!-- A single soft chin step replaces the dark head/body seam. -->
    <path id="axolotl-chin" fill="#f096a3" d="M 108,108 H 168 V 114 H 108 Z" />
  </g>
  <g id="axolotl-eyes" inkscape:groupmode="layer" inkscape:label="Eyes - blink" fill="#16130e">
    <path id="axolotl-eye-left" d="M 114,66 H 126 V 84 H 114 Z" />
    <path id="axolotl-eye-right" d="M 168,66 H 180 V 84 H 168 Z" />
  </g>
  <g id="axolotl-mouth" inkscape:groupmode="layer" inkscape:label="Mouth - eat" fill="#16130e">
    <path id="axolotl-mouth-shape" d="M 138,90 H 144 V 93 H 150 V 90 H 156 V 96 H 150 V 99 H 144 V 96 H 138 Z" />
  </g>
</svg>
