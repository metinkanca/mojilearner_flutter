name: mojilearner_flutter
description: "A new Flutter project for MojiLearner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # HTTP & API
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  
  # Audio
  flutter_sound: ^9.2.13
  permission_handler: ^11.1.0
  
  # UI & Animations
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  
  # Icons
  cupertino_icons: ^1.0.2
  lucide_icons: ^0.257.0
  google_generative_ai: ^0.4.7
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/svgs/
