name: mojilearner_flutter
description: "A new Flutter project for MojiLearner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # HTTP & API
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  
  # Audio
  flutter_sound: ^9.2.13
  permission_handler: ^11.1.0
  
  # UI & Animations
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  
  # Icons
  cupertino_icons: ^1.0.2
  lucide_icons: ^0.257.0
  google_generative_ai: ^0.4.7
  flutter_svg: ^2.2.3

  # Local reminders (pet care, reviews, daily reward).
  # timezone + flutter_timezone let a reminder keep meaning "8am local"
  # after the player changes time zone.
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/svgs/
  
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: PixelAEArabic
      fonts:
        - asset: assets/fonts/pixelae/PixelAE-Regular.ttf
    - family: SraPixelSmall
      fonts:
        - asset: assets/fonts/sra/PixelSmall.ttf
    - family: SraPixelMiddle
      fonts:
        - asset: assets/fonts/sra/PixelMiddle.ttf
    - family: SraPixelHigh
      fonts:
        - asset: assets/fonts/sra/PixelHigh.ttf
    - family: ArkPixelJa
      fonts:
        - asset: assets/fonts/ark/ark-pixel-16px-proportional-ja.ttf
    - family: ArkPixelKo
      fonts:
        - asset: assets/fonts/ark/ark-pixel-16px-proportional-ko.ttf
    - family: ArkPixelZhCn
      fonts:
        - asset: assets/fonts/ark/ark-pixel-16px-proportional-zh_cn.ttf
    - family: ArkPixelZhHk
      fonts:
        - asset: assets/fonts/ark/ark-pixel-16px-proportional-zh_hk.ttf
    - family: ArkPixelZhTw
      fonts:
        - asset: assets/fonts/ark/ark-pixel-16px-proportional-zh_tw.ttf
    - family: ArkPixelZhTr
      fonts:
        - asset: assets/fonts/ark/ark-pixel-16px-proportional-zh_tr.ttf
