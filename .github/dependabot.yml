# Weekly dependency updates, grouped so related packages move together.
#
# Grouping matters here, not just for tidiness: the FlutterFire packages
# (firebase_core, firebase_auth, cloud_firestore, firebase_app_check) have to be
# on versions that build together. Updating one alone once left firebase_core
# ahead of firebase_auth, which compiles in Dart and fails only in the Android
# release build. One pull request for the whole family is one CI run that tells
# the truth about whether they work together.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_firestore*"
      flutter-plugins-everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "firebase_*"
          - "cloud_firestore*"
    open-pull-requests-limit: 5

  # The AI proxy holds the model key, so its dependencies are worth watching.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
