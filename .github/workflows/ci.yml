name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three independent jobs rather than three steps in one: they have nothing to
# say to each other, they fail for unrelated reasons, and running them in
# parallel keeps the slowest one (the Android build) off the critical path of
# the fastest one (the server suite, which finishes in about a second).
jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than tracking `stable`: a Flutter release should
          # never be able to turn a green branch red on its own. Bump this
          # deliberately, in a commit that can be reverted.
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No .env step needed: nothing calls `dotenv.load()`, so the gitignored
      # .env configures nothing (see lib/constants/app_runtime_config.dart).
      # Verified by running the full suite with the file moved away.

      # No `dart format` gate on purpose: 109 of 203 files are currently
      # unformatted, so turning it on would fail every run until someone
      # reformats the tree. That reformat is a fine thing to do — but as its
      # own commit, not as a surprise CI failure.

      # --fatal-infos because the tree is at zero issues. Anything less and
      # the 61 infos we just cleared creep back one at a time.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter github

      # Not gating: `integration_test/` needs a device and is not run here.
      # If that changes, it belongs in its own job with an emulator, not
      # bolted onto this one.

  android-build:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This job exists because of a bug the other one could not see. A comment
    # in AndroidManifest.xml contained a double hyphen, which XML forbids, and
    # `flutter build apk` failed at :app:processDebugMainManifest for every
    # build. Analyze and test never parse the platform manifests, so the branch
    # stayed green while no Android artifact could be produced at all.
    steps:
      - uses: actions/checkout@v4

      # AGP 8.11 and Kotlin 2.2 target JVM 17; the app's own compileOptions
      # ask for VERSION_17 too. Set explicitly rather than inherited from
      # whatever the runner image happens to ship.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release rather than debug, because release is the artifact that ships
      # and it is the only one that runs R8 — a missing keep rule for Firebase
      # or the ad SDK is invisible in a debug build. Signing is not a problem
      # here: android/app/build.gradle.kts falls back to the debug keys when
      # key.properties is absent, which it always is on a fresh clone. The APK
      # is not uploaded anywhere; building it is the whole test.
      - name: Build release APK
        run: flutter build apk --release

  server:
    name: Proxy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The proxy stopped being a transport shim when the prompts moved into it.
    # Every persona, every format rule and every safety clause the app relies
    # on now lives in server/src/prompts.js, so leaving its suite to run only
    # when someone remembers would mean the app's behaviour is untested here.
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json asks for >=20. 22 is the current LTS and what the
          # Dockerfile builds on.
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
