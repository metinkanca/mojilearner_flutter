  <script>
    (() => {
      'use strict';
      const timeline = [{"startMs": 0, "durationMs": 110, "label": "Near hind contact", "pose": 0}, {"startMs": 110, "durationMs": 110, "label": "Weight settles", "pose": 1}, {"startMs": 220, "durationMs": 110, "label": "Near front contact", "pose": 2}, {"startMs": 330, "durationMs": 110, "label": "Passing", "pose": 3}, {"startMs": 440, "durationMs": 110, "label": "Far hind contact", "pose": 4}, {"startMs": 550, "durationMs": 110, "label": "Weight settles", "pose": 5}, {"startMs": 660, "durationMs": 110, "label": "Far front contact", "pose": 6}, {"startMs": 770, "durationMs": 110, "label": "Passing", "pose": 7}];
      const duration = 880;
      const svg = document.getElementById('cat-animation');
      const toggle = document.getElementById('play-toggle');
      const scrubber = document.getElementById('scrubber');
      const poseLabel = document.getElementById('pose-label');
      const timeLabel = document.getElementById('time-label');
      const note = document.getElementById('motion-note');
      const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
      const initialized = new WeakSet();
      let playing = !motionPreference.matches;
      let motionEnabled = !motionPreference.matches;
      let position = 0;
      let playbackRate = 1;
      scrubber.max = String(duration - 1);

      // The moving floor belongs to this preview, never to the exported artwork.
      const svgNS = 'http://www.w3.org/2000/svg';
      const ground = document.createElementNS(svgNS, 'g');
      ground.setAttribute('id', 'preview-ground');
      ground.setAttribute('fill', '#1f2223');
      ground.setAttribute('opacity', '.15');
      ground.setAttribute('aria-hidden', 'true');
      const groundLine = document.createElementNS(svgNS, 'rect');
      groundLine.setAttribute('x', '0');
      groundLine.setAttribute('y', '84');
      groundLine.setAttribute('width', String(svg.viewBox.baseVal.width));
      groundLine.setAttribute('height', '1');
      ground.appendChild(groundLine);
      const groundTicks = document.createElementNS(svgNS, 'g');
      groundTicks.setAttribute('id', 'ground-ticks');
      for (let x = -24; x <= 144; x += 24) {
        const tick = document.createElementNS(svgNS, 'rect');
        tick.setAttribute('x', String(x));
        tick.setAttribute('y', '85');
        tick.setAttribute('width', '3');
        tick.setAttribute('height', '1');
        groundTicks.appendChild(tick);
      }
      ground.appendChild(groundTicks);
      svg.insertBefore(ground, svg.querySelector('.pose'));

      function fitSprite(stage, availableWidth) {
        const sprite = stage.querySelector('svg');
        const nativeWidth = sprite.viewBox.baseVal.width;
        const nativeHeight = sprite.viewBox.baseVal.height;
        const scale = Math.max(1, Math.min(4, Math.floor(availableWidth / nativeWidth)));
        sprite.style.width = `${nativeWidth * scale}px`;
        sprite.style.height = `${nativeHeight * scale}px`;
        sprite.style.maxWidth = 'none';
        sprite.style.flexShrink = '0';
      }
      const stages = Array.from(document.querySelectorAll('.stage'));
      function fitAllSprites() {
        for (const stage of stages) {
          const style = getComputedStyle(stage);
          fitSprite(stage, stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
        }
      }
      fitAllSprites();
      if ('ResizeObserver' in window) {
        const stageObserver = new ResizeObserver(entries => {
          for (const entry of entries) fitSprite(entry.target, entry.contentRect.width);
        });
        for (const stage of stages) stageObserver.observe(stage);
      } else {
        window.addEventListener('resize', fitAllSprites);
      }

      function animations() {
        if (!motionEnabled) return [];
        const items = svg.getAnimations({ subtree: true });
        for (const animation of items) {
          if (initialized.has(animation)) continue;
          animation.pause();
          animation.currentTime = position;
          animation.updatePlaybackRate(playbackRate);
          if (playing) animation.play();
          initialized.add(animation);
        }
        return items;
      }

      function optIntoMotion() {
        motionEnabled = true;
        svg.classList.add('allow-motion');
        note.textContent = 'Drag the timeline to pause on a pose.';
      }

      function currentPosition() {
        const active = animations()[0];
        if (active && active.currentTime !== null) {
          position = ((Number(active.currentTime) % duration) + duration) % duration;
        }
        return position;
      }

      function render() {
        const time = currentPosition();
        const pose = timeline.find(entry => time >= entry.startMs && time < entry.startMs + entry.durationMs) || timeline[0];
        groundTicks.setAttribute('transform', `translate(${-(Math.floor(time / 110) % 8) * 3} 0)`);
        scrubber.value = String(Math.floor(time));
        poseLabel.textContent = pose ? pose.label : 'Contact';
        timeLabel.textContent = `${(time / 1000).toFixed(2)} / ${(duration / 1000).toFixed(2)} s`;
        scrubber.setAttribute('aria-valuetext', `${(time / 1000).toFixed(2)} seconds, ${pose ? pose.label : 'Contact'}`);
        toggle.textContent = playing ? 'Pause' : 'Play';
        toggle.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
      }

      function pause() {
        currentPosition();
        playing = false;
        for (const animation of animations()) {
          animation.pause();
          animation.currentTime = position;
        }
        render();
      }

      function play() {
        optIntoMotion();
        playing = true;
        for (const animation of animations()) {
          animation.currentTime = position;
          animation.play();
        }
        render();
      }

      toggle.addEventListener('click', () => playing ? pause() : play());
      document.getElementById('restart').addEventListener('click', () => {
        position = 0;
        for (const animation of animations()) animation.currentTime = 0;
        render();
      });
      document.getElementById('speed').addEventListener('change', event => {
        playbackRate = Number(event.target.value);
        for (const animation of animations()) animation.updatePlaybackRate(playbackRate);
        render();
      });
      scrubber.addEventListener('input', event => {
        const nextPosition = Number(event.target.value);
        pause();
        optIntoMotion();
        position = nextPosition;
        for (const animation of animations()) {
          animation.pause();
          animation.currentTime = position;
        }
        render();
      });
      for (const button of document.querySelectorAll('button[data-background]')) {
        button.addEventListener('click', () => {
          document.querySelector('main').dataset.background = button.dataset.background;
          for (const item of document.querySelectorAll('button[data-background]')) {
            item.setAttribute('aria-pressed', String(item === button));
          }
        });
      }
      motionPreference.addEventListener('change', event => {
        if (!event.matches) return;
        pause();
        position = 0;
        motionEnabled = false;
        svg.classList.remove('allow-motion');
        note.textContent = 'Reduced motion is on. Press Play to view the animation.';
        render();
      });
      if (motionPreference.matches) note.textContent = 'Reduced motion is on. Press Play to view the animation.';
      render();
      function tick() {
        if (playing) render();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
