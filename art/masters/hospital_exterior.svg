  <title id="title">Hospital exterior — city background study</title>
  <desc id="desc">A cream pixel-art hospital with teal windows, a coral medical sign and entrance canopy. Layered trees, flower planters, masonry joints, rooftop equipment and small street details frame an open forecourt. Quiet blue city silhouettes and flat, square-edged shading match the existing pet world.</desc>

